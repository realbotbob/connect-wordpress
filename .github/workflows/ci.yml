name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, openssl, sodium
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint (php -l)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Coding standard (PHPCS)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (PHPUnit + coverage)
        run: vendor/bin/phpunit --colors=never --coverage-text
